services:
  redis:
    container_name: con-redis-dochuc
    image: redis:latest
    ports:
      - "6380:6379"

  mongo:
    container_name: con-mongo-dochub
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"

  gateway:
    container_name: con-backend-dochub
    build: .
    ports:
      - "3070:3069"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
