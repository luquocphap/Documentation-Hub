name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --project tsconfig.build.json

      - name: Run unit tests
        run: npm test -- --runInBand

  build:
      runs-on: ubuntu-latest

      steps:
          - uses: actions/checkout@v4

          - name: Login Dockerhub
            run: docker login -u luquocphap -p ${{secrets.PASS_DOCKER}}
          
          - name: Build Image
            run: docker build -t luquocphap/doc-hub-backend:latest .
          
          - name: Push Image
            run: docker push luquocphap/doc-hub-backend:latest

